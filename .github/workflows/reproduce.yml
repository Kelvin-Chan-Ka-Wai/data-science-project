name: Reproduce the analysis

# Re-runs every notebook from a clean environment on each push, so the claim in the README
# ("three notebooks that run top to bottom") is checked rather than asserted.
# The executed notebooks are uploaded as an artifact, and the job fails if any cell errors.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  execute-notebooks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show the versions actually used
        run: |
          python -c "import bokeh, pandas, numpy, ipywidgets; \
          print('bokeh', bokeh.__version__); print('pandas', pandas.__version__); \
          print('numpy', numpy.__version__); print('ipywidgets', ipywidgets.__version__)"

      - name: Execute every notebook (fails on any error)
        run: |
          set -e
          for nb in notebooks/*.ipynb; do
            echo "::group::$nb"
            jupyter nbconvert --to notebook --execute --inplace \
              --ExecutePreprocessor.timeout=600 "$nb"
            echo "::endgroup::"
          done

      - name: Check the notebooks contain no error output
        run: python scripts/check_notebooks.py

      - name: Regenerate the interactive figures
        run: python scripts/make_figures.py

      - name: Upload the executed notebooks
        uses: actions/upload-artifact@v4
        with:
          name: executed-notebooks-py${{ matrix.python-version }}
          path: |
            notebooks/*.ipynb
            figures/html/*.html
          if-no-files-found: error
